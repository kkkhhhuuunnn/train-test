<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>후이 철교안 공부 - 철도교통안전관리자 CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2d;
      --card-inner: #1c2638;
      --border: #2c3a52;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 740px;
      margin: 0 auto;
      padding: 16px 14px 60px;
    }

    .screen {
      display: none;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 표지 화면 */
    .cover-wrapper {
      min-height: 82vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
    }

    .cover-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .cover-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.8rem;
      line-height: 1.25;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: keep-all;
    }

    .cover-sub {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
      word-break: keep-all;
    }

    .train-icon-box {
      font-size: 4.8rem;
      margin-bottom: 40px;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.35));
      animation: bounceTrain 2.5s infinite ease-in-out;
    }

    @keyframes bounceTrain {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #04121e;
      border: none;
      padding: 16px 28px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: 'Jua', sans-serif;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
      width: 100%;
      max-width: 340px;
      transition: transform 0.2s;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    /* 대시보드 헤더 */
    .app-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .header-info h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'Jua', sans-serif;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .score-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .filter-select {
      width: 100%;
      background: #0d1424;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      margin-bottom: 16px;
      font-family: inherit;
    }

    /* 퀴즈 카드 */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 16px;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-tag {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .q-num {
      background: var(--primary);
      color: #04121e;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .q-text {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.55;
      color: #fff;
      margin-bottom: 16px;
      word-break: keep-all;
      white-space: pre-line;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      font-size: 0.92rem;
      color: #e2e8f0;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
      transition: all 0.2s ease;
      word-break: keep-all;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #243248;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.selected-correct {
      background: rgba(34, 197, 94, 0.16) !important;
      border-color: var(--correct) !important;
      color: #4ade80 !important;
      font-weight: 700;
    }

    .option-btn.selected-wrong {
      background: rgba(239, 68, 68, 0.16) !important;
      border-color: var(--wrong) !important;
      color: #f87171 !important;
    }

    .option-btn.highlight-ans {
      border-color: var(--correct) !important;
      background: rgba(34, 197, 94, 0.08) !important;
      color: #4ade80 !important;
    }

    .exp-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #0d1424;
      border-left: 4px solid var(--primary);
    }

    .exp-badge {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .exp-badge.correct { color: var(--correct); }
    .exp-badge.wrong { color: var(--wrong); }

    .exp-content {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      word-break: keep-all;
    }

    .bottom-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-sub {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1페이지: 표지 -->
    <div class="screen active" id="screenCover">
      <div class="cover-wrapper">
        <div class="cover-badge">KOTSA 철도교통안전관리자 완전정복</div>
        <h1 class="cover-title">후이 철교안 공부</h1>
        <p class="cover-sub">제1편 철도안전법 & 제2편 교통안전관리론<br>단원별 기출문제 CBT 은행</p>
        <div class="train-icon-box">🚅✨</div>
        <button class="btn-main" onclick="startCBT()">기출문제 풀러 가기 ➔</button>
      </div>
    </div>

    <!-- 2페이지: CBT 문제풀이 -->
    <div class="screen" id="screenCBT">
      <header class="app-header">
        <div class="header-info">
          <h2>후이 철교안 공부</h2>
          <p id="totalCountLabel">단원을 선택해 주세요</p>
        </div>
        <div class="score-badge" id="scoreDisplay">0 / 0 점</div>
      </header>

      <!-- 단원 선택 (선택 시 해당 json 파일을 자동으로 fetch) -->
      <select class="filter-select" id="chapterFilter" onchange="onChapterSelect()">
        <optgroup label="제1편 교통법규 (철도안전법)">
          <option value="law1.json" selected>제1장 총칙 및 안전관리체계 (78문항)</option>
          <option value="law2.json">제2장 철도종사자의 안전관리 (63문항)</option>
          <option value="law3.json">제3장 철도시설 및 차량 안전관리 (40문항)</option>
          <option value="law4.json">제4장 운행안전 및 철도보호 (50문항)</option>
          <option value="law5.json">제5장 철도안전기반 구축 및 벌칙 (45문항)</option>
        </optgroup>
        <optgroup label="제2편 교통안전관리론">
          <option value="mgt1.json">제1장 교통안전의 일반이론 (54문항)</option>
          <option value="mgt2.json">제2장 교통사고 발생 원인 (61문항)</option>
          <option value="mgt3.json">제3장 교통사고 방지 대책 (60문항)</option>
          <option value="mgt4.json">제4장 교통안전 관리 조직 (57문항)</option>
          <option value="mgt5.json">제5장 교통안전 환경 (52문항)</option>
        </optgroup>
      </select>

      <div id="quizList"></div>

      <div class="bottom-btn-group">
        <button class="btn-sub" onclick="resetCover()">표지로 돌아가기</button>
        <button class="btn-sub" onclick="window.scrollTo({top:0, behavior:'smooth'})">맨 위로 가기</button>
      </div>
    </div>

  </div>

  <script>
    let currentQuestions = [];
    let solvedCount = 0;
    let correctCount = 0;

    // 선택된 json 파일을 비동기로 불러오는 핵심 함수
    async function fetchChapterData(filename) {
      const listEl = document.getElementById('quizList');
      listEl.innerHTML = '<div style="text-align:center; padding:50px 20px; color:var(--text-muted);">문제를 불러오는 중입니다... ⏳</div>';
      
      try {
        const response = await fetch(`./${filename}`);
        if (!response.ok) {
          throw new Error(`${filename} 파일을 찾을 수 없습니다.`);
        }
        currentQuestions = await response.json();
        solvedCount = 0;
        correctCount = 0;
        renderList();
        updateHeader();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <div style="text-align:center; padding:50px 20px; color:#f87171; line-height:1.6;">
            <strong>⚠️ [${filename}] 파일을 불러오지 못했습니다.</strong><br>
            <span style="font-size:0.85rem; color:var(--text-muted);">
              깃허브 저장소에 <code>${filename}</code> 파일이 생성되어 있는지 확인해 주세요.
            </span>
          </div>`;
        document.getElementById('totalCountLabel').innerText = '문제 로드 대기 중';
        document.getElementById('scoreDisplay').innerText = '0 / 0 점';
      }
    }

    function startCBT() {
      document.getElementById('screenCover').classList.remove('active');
      document.getElementById('screenCBT').classList.add('active');
      onChapterSelect();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetCover() {
      document.getElementById('screenCBT').classList.remove('active');
      document.getElementById('screenCover').classList.add('active');
      solvedCount = 0;
      correctCount = 0;
      updateHeader();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function onChapterSelect() {
      const selectedFile = document.getElementById('chapterFilter').value;
      fetchChapterData(selectedFile);
    }

    function renderList() {
      const listEl = document.getElementById('quizList');
      listEl.innerHTML = '';

      if (!currentQuestions || currentQuestions.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:50px 20px; color:var(--text-muted);">등록된 문제가 없습니다.</div>';
        return;
      }

      currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `qCard_${idx}`;

        card.innerHTML = `
          <div class="q-meta">
            <span class="q-tag">${q.catName || '기출문제'}</span>
            <span class="q-num">Q${idx + 1}</span>
          </div>
          <div class="q-text">${q.q}</div>
          <div class="options-group">
            ${q.opts.map((opt, oIdx) => `
              <button class="option-btn" onclick="checkAnswer(${idx}, ${oIdx})">
                <strong style="color:var(--text-muted);">${oIdx + 1}.</strong>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div class="exp-box" id="exp_${idx}">
            <div class="exp-badge" id="badge_${idx}"></div>
            <div class="exp-content">${q.exp}</div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function checkAnswer(qIdx, selectedIdx) {
      const q = currentQuestions[qIdx];
      const card = document.getElementById(`qCard_${qIdx}`);
      const btns = card.querySelectorAll('.option-btn');
      const expBox = document.getElementById(`exp_${qIdx}`);
      const badge = document.getElementById(`badge_${qIdx}`);

      btns.forEach(b => b.disabled = true);

      if (selectedIdx === q.ans) {
        btns[selectedIdx].classList.add('selected-correct');
        badge.className = 'exp-badge correct';
        badge.innerText = '⭕ 정답입니다!';
        correctCount++;
      } else {
        btns[selectedIdx].classList.add('selected-wrong');
        btns[q.ans].classList.add('highlight-ans');
        badge.className = 'exp-badge wrong';
        badge.innerText = `❌ 오답입니다! (정답: ${q.ans + 1}번)`;
      }

      expBox.style.display = 'block';
      solvedCount++;
      updateHeader();
    }

    function updateHeader() {
      const total = currentQuestions.length;
      document.getElementById('totalCountLabel').innerText = `총 ${total}문항 로드 완료`;
      const score = (total > 0 && solvedCount > 0) ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById('scoreDisplay').innerText = `${correctCount} / ${solvedCount} 문제 (${score}점)`;
    }
  </script>
</body>
</html>
