<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>후이 철교안 공부 - 철도교통안전관리자 CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2d;
      --card-inner: #1c2638;
      --border: #2c3a52;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px 60px;
    }

    /* 화면 전환 제어 */
    .screen {
      display: none;
      width: 100%;
      animation: fadeIn 0.35s ease;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. 첫 페이지: 표지 화면 */
    .cover-wrapper {
      min-height: 82vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
    }

    .cover-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .cover-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.7rem;
      line-height: 1.25;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: keep-all;
    }

    .cover-sub {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
      word-break: keep-all;
    }

    .train-icon-box {
      font-size: 4.5rem;
      margin-bottom: 40px;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.35));
      animation: bounceTrain 2.5s infinite ease-in-out;
    }

    @keyframes bounceTrain {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .cover-btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #04121e;
      border: none;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: 'Jua', sans-serif;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-sub {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 35px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sub:hover {
      background: #243248;
    }

    /* 2. 대시보드 공통 헤더 */
    .app-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-info h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'Jua', sans-serif;
    }

    .header-info p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .score-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* 네비게이션 탭 */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 11px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #04121e;
      border-color: var(--primary);
    }

    .filter-select {
      width: 100%;
      background: #0d1424;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 16px;
      font-family: inherit;
    }

    /* 3. 개념 요약 카드 스타일 */
    .concept-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 16px;
      line-height: 1.65;
    }

    .concept-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-section {
      margin-bottom: 16px;
    }

    .concept-section:last-child {
      margin-bottom: 0;
    }

    .concept-h4 {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .concept-ul {
      list-style: none;
      padding-left: 4px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .concept-ul li {
      margin-bottom: 5px;
      position: relative;
      padding-left: 14px;
      word-break: keep-all;
    }

    .concept-ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
    }

    .highlight {
      color: #fff;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 4. CBT 문제 카드 */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 16px;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-tag {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .q-num {
      background: var(--primary);
      color: #04121e;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .q-text {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.55;
      color: #fff;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      font-size: 0.92rem;
      color: #e2e8f0;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
      transition: all 0.2s ease;
      word-break: keep-all;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #243248;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.selected-correct {
      background: rgba(34, 197, 94, 0.16) !important;
      border-color: var(--correct) !important;
      color: #4ade80 !important;
      font-weight: 700;
    }

    .option-btn.selected-wrong {
      background: rgba(239, 68, 68, 0.16) !important;
      border-color: var(--wrong) !important;
      color: #f87171 !important;
    }

    .option-btn.highlight-ans {
      border-color: var(--correct) !important;
      background: rgba(34, 197, 94, 0.08) !important;
      color: #4ade80 !important;
    }

    .exp-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #0d1424;
      border-left: 4px solid var(--primary);
    }

    .exp-badge {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .exp-badge.correct { color: var(--correct); }
    .exp-badge.wrong { color: var(--wrong); }

    .exp-content {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.6;
      word-break: keep-all;
    }

    .bottom-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1페이지: 메인 표지 -->
    <div class="screen active" id="screenCover">
      <div class="cover-wrapper">
        <div class="cover-badge">KOTSA 국가자격시험 마스터</div>
        <h1 class="cover-title">후이 철교안 공부</h1>
        <p class="cover-sub">철도교통안전관리자 핵심 요약집 &<br>기출문제 CBT 실전 은행</p>
        <div class="train-icon-box">🚅✨</div>
        <div class="cover-btn-group">
          <button class="btn-main" onclick="goToMode('cbt')">실전 기출 CBT 문제풀기 ➔</button>
          <button class="btn-sub" onclick="goToMode('summary')">📖 1·2권 핵심 개념집 보기</button>
        </div>
      </div>
    </div>

    <!-- 2페이지: 학습 & CBT 화면 -->
    <div class="screen" id="screenMain">
      <header class="app-header">
        <div class="header-info">
          <h2>후이 철교안 공부</h2>
          <p id="subStatus">CBT 실전 모드</p>
        </div>
        <div class="score-badge" id="scoreDisplay">0 / 0 점</div>
      </header>

      <div class="nav-tabs">
        <button class="tab-btn active" id="tabBtnCBT" onclick="switchTab('cbt')">실전 기출 CBT</button>
        <button class="tab-btn" id="tabBtnSummary" onclick="switchTab('summary')">단원별 핵심요약</button>
      </div>

      <select class="filter-select" id="chapterFilter" onchange="onFilterChange()">
        <option value="ALL">전체 과목 모아보기 (전체 풀기)</option>
        <optgroup label="제1편 교통법규 (철도안전법)">
          <option value="LAW1">제1장 총칙 및 안전관리체계</option>
          <option value="LAW2">제2장 철도종사자의 안전관리</option>
          <option value="LAW3">제3장 철도시설 및 차량 안전관리</option>
          <option value="LAW4">제4장 운행안전 및 철도보호</option>
          <option value="LAW5">제5장 철도안전기반 구축 및 벌칙</option>
        </optgroup>
        <optgroup label="제2편 교통안전관리론">
          <option value="MGT1">제1장 교통안전의 일반이론</option>
          <option value="MGT2">제2장 교통사고 발생 원인</option>
          <option value="MGT3">제3장 교통사고 방지 대책</option>
          <option value="MGT4">제4장 교통안전 관리 조직</option>
          <option value="MGT5">제5장 교통안전 환경</option>
        </optgroup>
      </select>

      <!-- 문제 컨테이너 -->
      <div id="quizContainer"></div>

      <!-- 개념 요약 컨테이너 -->
      <div id="summaryContainer" style="display:none;"></div>

      <div class="bottom-btn-group">
        <button class="btn-sub" style="flex:1;" onclick="resetAll()">처음으로</button>
        <button class="btn-sub" style="flex:1;" onclick="window.scrollTo({top:0, behavior:'smooth'})">맨 위로</button>
      </div>
    </div>

  </div>

  <script>
    /* =========================================================
       1. 핵심 개념 정리 데이터 (1권 법규 + 2권 안전관리론)
       ========================================================= */
    const conceptSummaryData = {
      LAW1: {
        title: "제1편 제1장: 총칙 및 안전관리체계",
        content: `
          <div class="concept-section">
            <div class="concept-h4">1. 주요 용어의 정의</div>
            <ul class="concept-ul">
              <li><span class="highlight">열차</span>: 선로를 운행할 목적으로 철도운영자가 편성하여 <strong>'열차번호'</strong>를 부여한 철도차량 (차량번호 ❌)</li>
              <li><span class="highlight">철도종사자</span>: 운전업무종사자, 관제업무종사자, 여객승무원, 여객역무원, 작업책임자, 철도운행안전관리자 등</li>
              <li><span class="highlight">철도교통사고 vs 철도안전사고</span>: 운행 관련 사고(충돌, 탈선, 열차화재)는 '교통사고', 시설관리 관련(역사 화재, 시설파손)은 '안전사고' (자연재난 제외)</li>
              <li><span class="highlight">운행장애 지연 기준</span>: 고속·전동열차 <strong>20분 이상</strong>, 일반여객열차 <strong>30분 이상</strong>, 화물열차 <strong>60분 이상</strong></li>
            </ul>
          </div>
          <div class="concept-section">
            <div class="concept-h4">2. 법정 계획 및 승인 절차</div>
            <ul class="concept-ul">
              <li><span class="highlight">철도안전 종합계획</span>: 국토교통부장관이 <strong>5년마다</strong> 수립, 관보에 고시</li>
              <li><span class="highlight">시행계획 제출</span>: 시·도지사 및 운영자등이 매년 <strong>10월 말까지</strong> 제출 (추진실적은 매년 2월 말까지)</li>
              <li><span class="highlight">철도안전투자 공시</span>: 철도운영자가 매년 <strong>5월 말까지</strong> 공시</li>
              <li><span class="highlight">안전관리체계 승인</span>: 개시 예정일 <strong>90일 전까지</strong> 신청 (정기검사는 1년마다 1회)</li>
              <li><span class="highlight">절대적 취소 사유</span>: 거짓이나 그 밖의 부정한 방법으로 승인을 받은 경우 (반드시 취소)</li>
            </ul>
          </div>`
      },
      LAW2: {
        title: "제1편 제2장: 철도종사자의 안전관리",
        content: `
          <div class="concept-section">
            <div class="concept-h4">1. 운전면허 및 적성검사 기준</div>
            <ul class="concept-ul">
              <li><span class="highlight">운전면허 결격사유</span>: <strong>19세 미만</strong>, 뇌전증·정신질환자, 약물·알코올 중독자, 청력·시력 완전 상실자, 취소 후 2년 미경과자</li>
              <li><span class="highlight">운전적성검사 불합격</span>: 불합격자는 <strong>3개월</strong>, 부정행위자는 <strong>1년</strong>간 응시 제한</li>
              <li><span class="highlight">운전면허 유효기간</span>: <strong>10년</strong> (만료 전 6개월 이내 갱신 신청, 취소·정지 시 15일 이내 반납)</li>
              <li><span class="highlight">관제자격증명 종류</span>: 도시철도 관제자격증명, 철도 관제자격증명 (2종류)</li>
              <li><span class="highlight">정기 적성검사 주기</span>: 최초검사 후 <strong>10년(50세 이상은 5년)</strong>마다 (신체검사는 2년마다)</li>
            </ul>
          </div>`
      },
      LAW3: {
        title: "제1편 제3장: 철도시설 및 차량 안전관리",
        content: `
          <div class="concept-section">
            <div class="concept-h4">1. 형식승인 및 종합시험운행</div>
            <ul class="concept-ul">
              <li><span class="highlight">철도차량 부품 공급기간</span>: 완성검사를 받은 날부터 <strong>20년 이상</strong> 의무 공급</li>
              <li><span class="highlight">종합시험운행 절차</span>: <strong>시설물검증시험</strong>(최고속도까지 증속) ➔ <strong>영업시운전</strong>(실제 영업상태 점검) 순서대로 실시</li>
              <li><span class="highlight">정밀안전진단 주기</span>: 계속 사용 인정 차량은 최초 기간 기준 <strong>5년마다</strong> 정기 정밀안전진단</li>
            </ul>
          </div>`
      },
      LAW4: {
        title: "제1편 제4장: 운행안전 및 철도보호",
        content: `
          <div class="concept-section">
            <div class="concept-h4">1. 음주 기준 및 철도보호지구</div>
            <ul class="concept-ul">
              <li><span class="highlight">음주 기준</span>: 운전·관제·승무·점검정비 종사자는 <strong>0.02% 이상</strong>, 작업책임자·철도운행안전관리자는 <strong>0.03% 이상</strong></li>
              <li><span class="highlight">철도보호지구 범위</span>: 철도경계선(최외측 궤도 끝선)으로부터 <strong>30m 이내</strong> (노면전차는 10m 이내)</li>
              <li><span class="highlight">철도사고 즉시보고 기준</span>: 열차 충돌·탈선, 화재 운행중지, <strong>사상자 3명 이상</strong>, <strong>재산피해 5천만 원 이상</strong></li>
            </ul>
          </div>`
      },
      LAW5: {
        title: "제1편 제5장: 철도안전기반 구축 및 벌칙",

      { cat: "MGT2", catName: "안전관리론 제2장", q: "야간에 반대차선 교행차량의 전조등 불빛이 교차할 때 도로 중앙의 보행자가 순간적으로 사라져 보이는 현상은?", opts: ["현혹현상", "증발현상", "페이드현상", "베이퍼록현상"], ans: 1, exp: "빛의 중첩으로 보행자가 증발하듯 보이지 않는 현상을 '증발현상'이라고 합니다." },
      { cat: "MGT2", catName: "안전관리론 제2장", q: "하인리히의 3E 이론에서 사고 방지를 위한 3대 기본 축에 해당하지 않는 것은?", opts: ["Engineering(기술)", "Education(교육)", "Enforcement(규제/관리)", "Effort(노력)"], ans: 3, exp: "하인리히의 3E는 Engineering(기술), Education(교육), Enforcement(규제/관리)입니다." },
      { cat: "MGT2", catName: "안전관리론 제2장", q: "어느 한 요인이라도 배제되면 연쇄반응이 일어나지 않아 사고가 방지된다는 이론은?", opts: ["사고의 등치성 원리", "도미노 이론", "욕조곡선 원리", "잠재오류 이론"], ans: 0, exp: "사고를 구성하는 요소들이 같은 비중을 지니며, 하나만 빠져도 사고가 안 난다는 원리입니다." },

      { cat: "MGT3", catName: "안전관리론 제3장", q: "기계 부품에 결함이 발생하더라도 위험한 상태로 전이되지 않고 안전이 확보되도록 설계하는 기법은?", opts: ["Fool-Proof", "Fail-Safe", "TBM", "TQC"], ans: 1, exp: "고장(Fail) 시에도 안전(Safe)을 유지하도록 하는 설계를 'Fail-Safe'라고 합니다." },
      { cat: "MGT3", catName: "안전관리론 제3장", q: "하인리히의 재해구성 비율 법칙(중상 : 경상 : 무상해 사고)으로 옳은 것은?", opts: ["1 : 10 : 30", "1 : 29 : 300", "1 : 30 : 600", "1 : 50 : 500"], ans: 1, exp: "1번의 대형사고 뒤에는 29번의 경상해와 300번의 잠재 징후가 있다는 1:29:300 법칙입니다." },
      { cat: "MGT3", catName: "안전관리론 제3장", q: "위험예측 4단계(IPDE)의 올바른 순서는?", opts: ["확인 - 예측 - 결정 - 실행", "예측 - 확인 - 결정 - 실행", "확인 - 결정 - 예측 - 실행", "예측 - 결정 - 확인 - 실행"], ans: 0, exp: "확인(Identify) ➔ 예측(Predict) ➔ 결정(Decision) ➔ 실행(Execute) 순서입니다." },

      /* [교통안전관리론 4장] */
      { cat: "MGT4", catName: "안전관리론 제4장", q: "매슬로우의 욕구 5단계 중 가장 상위 단계에 해당하는 욕구는?", opts: ["생리적 욕구", "안전의 욕구", "존중의 욕구", "자아실현의 욕구"], ans: 3, exp: "생리적 ➔ 안전 ➔ 사회적 ➔ 존중 ➔ 자아실현의 욕구 순으로 발전합니다." },
      { cat: "MGT4", catName: "안전관리론 제4장", q: "지휘명령 계통이 명확하여 추진력이 강력하나 참모의 전문적 조언을 받기 어려운 안전조직 형태는?", opts: ["라인형 조직", "스탭형 조직", "라인·스탭 혼합형", "프로젝트 조직"], ans: 0, exp: "명령계통이 수직적이어서 강력한 추진력을 발휘하는 것은 '라인형 조직'입니다." },

      /* [교통안전관리론 5장] */
      { cat: "MGT5", catName: "안전관리론 제5장", q: "초기 고장률이 높다가 안정화된 후 마모기에 다시 고장률이 증가하는 설비 고장률 특성 곡선은?", opts: ["학습곡선", "욕조곡선(Bathtub Curve)", "S자 곡선", "정규분포곡선"], ans: 1, exp: "고장률 곡선 형태가 욕조 모양을 띤다고 하여 '욕조곡선(Bathtub Curve)'이라고 합니다." },
      { cat: "MGT5", catName: "안전관리론 제5장", q: "특정 지점에서 집중 단속을 실시하면 단속을 중지한 후에도 일정 기간 효과가 지속되는 현상은?", opts: ["할로 효과(Halo Effect)", "스필오버 효과", "칵테일파티 효과", "피그말리온 효과"], ans: 0, exp: "단속 중지 후에도 효과가 일정 기간 지속되고 인접 지역으로 파급되는 현상을 '할로 효과'라고 합니다." }
    ];

    let currentFilter = "ALL";
    let filteredQuestions = [];
    let solvedCount = 0;
    let correctCount = 0;

    /* 화면 전환 함수 */
    function goToMode(mode) {
      document.getElementById('screenCover').classList.remove('active');
      document.getElementById('screenMain').classList.add('active');
      switchTab(mode);
    }

    function switchTab(tab) {
      const isCBT = (tab === 'cbt');
      document.getElementById('tabBtnCBT').classList.toggle('active', isCBT);
      document.getElementById('tabBtnSummary').classList.toggle('active', !isCBT);
      document.getElementById('quizContainer').style.display = isCBT ? 'block' : 'none';
      document.getElementById('summaryContainer').style.display = isCBT ? 'none' : 'block';
      document.getElementById('subStatus').innerText = isCBT ? '실전 기출 CBT 모드' : '단원별 핵심요약집';

      if (isCBT) {
        renderQuiz();
      } else {
        renderSummary();
      }
    }

    function onFilterChange() {
      currentFilter = document.getElementById('chapterFilter').value;
      solvedCount = 0;
      correctCount = 0;
      updateScore();
      if (document.getElementById('tabBtnCBT').classList.contains('active')) {
        renderQuiz();
      } else {
        renderSummary();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSummary() {
      const container = document.getElementById('summaryContainer');
      container.innerHTML = '';

      const keys = (currentFilter === 'ALL') 
        ? Object.keys(conceptSummaryData) 
        : [currentFilter];

      keys.forEach(k => {
        if (conceptSummaryData[k]) {
          const item = conceptSummaryData[k];
          const card = document.createElement('div');
          card.className = 'concept-card';
          card.innerHTML = `
            <div class="concept-title">📌 ${item.title}</div>
            ${item.content}
          `;
          container.appendChild(card);
        }
      });
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      filteredQuestions = (currentFilter === 'ALL')
        ? allQuizData
        : allQuizData.filter(q => q.cat === currentFilter);

      document.getElementById('totalCountLabel').innerText = `총 ${filteredQuestions.length}문항 탑재`;

      filteredQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `qCard_${idx}`;

        card.innerHTML = `
          <div class="q-meta">
            <span class="q-tag">${q.catName}</span>
            <span class="q-num">Q${idx + 1}</span>
          </div>
          <div class="q-text">${q.q}</div>
          <div class="options-group">
            ${q.opts.map((opt, oIdx) => `
              <button class="option-btn" onclick="submitAnswer(${idx}, ${oIdx})">
                <strong style="color:var(--text-muted);">${oIdx + 1}.</strong>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div class="exp-box" id="exp_${idx}">
            <div class="exp-badge" id="badge_${idx}"></div>
            <div class="exp-content">${q.exp}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function submitAnswer(qIdx, selectedOptIdx) {
      const q = filteredQuestions[qIdx];
      const card = document.getElementById(`qCard_${qIdx}`);
      const btns = card.querySelectorAll('.option-btn');
      const expBox = document.getElementById(`exp_${qIdx}`);
      const badge = document.getElementById(`badge_${qIdx}`);

      btns.forEach(b => b.disabled = true);

      if (selectedOptIdx === q.ans) {
        btns[selectedOptIdx].classList.add('selected-correct');
        badge.className = 'exp-badge correct';
        badge.innerText = '⭕ 정답입니다!';
        correctCount++;
      } else {
        btns[selectedOptIdx].classList.add('selected-wrong');
        btns[q.ans].classList.add('highlight-ans');
        badge.className = 'exp-badge wrong';
        badge.innerText = `❌ 오답입니다! (정답: ${q.ans + 1}번)`;
      }

      expBox.style.display = 'block';
      solvedCount++;
      updateScore();
    }

    function updateScore() {
      const total = filteredQuestions.length;
      const score = (total > 0 && solvedCount > 0) ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById('scoreDisplay').innerText = `${correctCount} / ${solvedCount} 문제 (${score}점)`;
    }

    function resetAll() {
      document.getElementById('screenMain').classList.remove('active');
      document.getElementById('screenCover').classList.add('active');
      solvedCount = 0;
      correctCount = 0;
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      filteredQuestions = allQuizData;
      renderQuiz();
    });
  </script>
